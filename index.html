<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolysium — Multi-Source AI Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --tiktok-pink: #ff0050;
            --tiktok-blue: #00f2fe;
            --text-color: #f8fafc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hero-title {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .card-custom {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-custom:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.2);
        }
        .card-tiktok {
            border: 1px solid rgba(255, 0, 80, 0.3);
        }
        .card-tiktok:hover {
            box-shadow: 0 12px 30px rgba(255, 0, 80, 0.25);
        }
        .card-img-top {
            height: 180px;
            object-fit: cover;
        }
        .badge-tiktok {
            background-color: #000;
            color: #fff;
            border: 1px solid var(--tiktok-pink);
        }
        .topic-btn {
            border-radius: 20px;
            padding: 8px 18px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            background: transparent;
        }
        .topic-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            border: none;
            color: white;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-shield-halved text-info fs-3"></i>
                <span class="fw-bold fs-4 text-white">Evolysium</span>
            </a>
            <span class="badge bg-dark border border-info text-info rounded-pill px-3 py-2">
                <i class="fa-brands fa-tiktok me-1 text-danger"></i> Reddit + TikTok Engine
            </span>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center text-center mb-5">
            <div class="col-lg-8">
                <h1 class="display-4 hero-title mb-3">Multi-Source Intelligence.</h1>
                <p class="lead text-secondary">Real-time Reddit & TikTok feeds stripped of clickbait, ads, and promotional noise.</p>
            </div>
        </div>

        <div class="row justify-content-center mb-5">
            <div class="col-lg-10 text-center">
                <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
                    <button class="topic-btn active" onclick="toggleTopic('crypto', this)"><i class="fa-solid fa-coins me-2"></i>Crypto</button>
                    <button class="topic-btn active" onclick="toggleTopic('travel', this)"><i class="fa-solid fa-plane me-2"></i>Travel</button>
                    <button class="topic-btn" onclick="toggleTopic('tech', this)"><i class="fa-solid fa-microchip me-2"></i>Tech & AI</button>
                    <button class="topic-btn" onclick="toggleTopic('gaming', this)"><i class="fa-solid fa-gamepad me-2"></i>Gaming</button>
                </div>
                <button class="btn btn-primary-custom" onclick="fetchCleanFeed()">
                    <i class="fa-solid fa-arrows-rotate me-2"></i> Fetch Multi-Source AI Feed
                </button>
            </div>
        </div>

        <!-- Dynamic Visual Cards Grid -->
        <div id="loading-spinner" class="text-center py-5 d-none">
            <div class="spinner-border text-info" style="width: 3rem; height: 3rem;" role="status"></div>
            <p class="mt-3 text-secondary">Parsing Reddit and TikTok streams...</p>
        </div>

        <div id="feed-grid" class="row g-4">
            <div class="text-center py-5 text-secondary">
                <i class="fa-brands fa-tiktok fs-1 mb-3 text-info"></i>
                <p>Click "Fetch Multi-Source AI Feed" to generate your visual stream.</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://evolysium-backend.onrender.com";
        let activeTopics = ["crypto", "travel"];

        function toggleTopic(topic, btn) {
            btn.classList.toggle("active");
            if (activeTopics.includes(topic)) {
                activeTopics = activeTopics.filter(t => t !== topic);
            } else {
                activeTopics.push(topic);
            }
        }

        async function fetchCleanFeed() {
            const spinner = document.getElementById("loading-spinner");
            const grid = document.getElementById("feed-grid");

            spinner.classList.remove("d-none");
            grid.innerHTML = "";

            try {
                const response = await fetch(`${API_BASE}/api/feed?topics=${activeTopics.join(",")}`);
                const data = await response.json();

                if (data.success && data.items && data.items.length > 0) {
                    grid.innerHTML = data.items.map(item => {
                        const isTikTok = item.type === "tiktok";
                        return `
                            <div class="col-md-6 col-lg-4">
                                <div class="card card-custom ${isTikTok ? 'card-tiktok' : ''} h-100">
                                    <img src="${item.image}" class="card-img-top" alt="Topic image">
                                    <div class="card-body d-flex flex-column">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <span class="badge ${isTikTok ? 'badge-tiktok' : 'bg-secondary text-light'}">
                                                ${isTikTok ? '<i class="fa-brands fa-tiktok text-danger me-1"></i>' : ''}${item.source}
                                            </span>
                                            <i class="fa-solid fa-circle-check text-info"></i>
                                        </div>
                                        <h5 class="card-title text-light fs-6 fw-bold">${item.title}</h5>
                                        <p class="card-text text-secondary small flex-grow-1">${item.summary}</p>
                                        <a href="${item.url}" target="_blank" class="btn ${isTikTok ? 'btn-outline-danger' : 'btn-outline-info'} btn-sm mt-3 w-100">
                                            ${isTikTok ? '<i class="fa-brands fa-tiktok me-1"></i> Watch Signal' : 'Read Signal'}
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                grid.innerHTML = `<div class="alert alert-danger w-100 text-center">Backend is connecting... Please click again in a few seconds.</div>`;
            } finally {
                spinner.classList.add("d-none");
            }
        }
    </script>
</body>
</html>
